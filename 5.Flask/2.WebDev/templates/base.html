<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} My Website {% endblock %}</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }
        header{
            background-color: aqua;
            color: brown;
            padding: 10px;
        }
        footer{
            background-color: rgb(0, 89, 255);
            color: aliceblue;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h2>My site</h2>
        <nav>
            <a href="/home">Home</a>
            <a href="/about">About</a>
        </nav>
    </header>

    {% block content %} {% endblock %}
    
    <footer>
        <p>@2026 This is the best way to learn complete DATA SCIENCE</p>
    </footer>
</body>
</html>
